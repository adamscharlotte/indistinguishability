[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "indistinguishability"
version = "0.1.0"
description = "Loading and plotting toolkit for indistinguishable peptides (spectral-similarity study)"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "rapidfuzz",
    "matplotlib",
    "seaborn",
]

[project.optional-dependencies]
# Koina spectrum prediction + mirror plots (spectra.py). Heavier, kept optional.
spectra = [
    "koinapy",
    "spectrum_utils",
]

[tool.setuptools.packages.find]
where = ["src"]
